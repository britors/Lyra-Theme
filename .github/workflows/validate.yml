name: validate
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - run: zypper --non-interactive install tar xz git sassc ImageMagick nodejs rsvg-convert
      - uses: actions/checkout@v4
      - run: ./scripts/build.sh
      - run: |
          grep -Fqx 'ModuleName=two-step' dist/plymouth/Lyra-OS/Lyra-OS.plymouth
          test -f dist/plymouth/Lyra-OS/watermark.png
          test -x dist/dracut/51lyra-plymouth/module-setup.sh
          bash -n dist/dracut/51lyra-plymouth/module-setup.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lyra-OS
          path: Lyra-OS.tar.xz
